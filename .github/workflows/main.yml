name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files for the app
        run: |
          mkdir -p www
          cp index.html www/
      - run: npx cap add android
      - name: Install app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/res/. android/app/src/main/res/
      - name: Lock portrait orientation
        run: sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nova-super-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
